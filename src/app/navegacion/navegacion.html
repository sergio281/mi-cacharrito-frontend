<nav class="navbar navbar-expand-lg sticky-top barra-navegacion">
    <div class="container-fluid contenedor-barra">

        <!-- Logo -->
        <a class="navbar-brand marca" href="#inicio">
            Mi Cacharrito<span class="marca-punto">.</span>
        </a>

        <!-- Botón hamburguesa para móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú colapsable -->
        <div class="collapse navbar-collapse" id="menuPrincipal">

            <!-- Enlaces centrados -->
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#inicio">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vehiculos">Vehículos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#como-funciona">Cómo funciona</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#contacto">Contacto</a>
                </li>
            </ul>

            <ng-container *ngIf="authService.sesion$ | async as cuenta; else botonLogin">
                <div class="dropdown">
                    <button class="chip-usuario dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <!-- Casteo a Admin usando $any() -->
                        <ng-container *ngIf="cuenta.rol === 'ADMIN'">
                            {{ $any(cuenta).username }}
                        </ng-container>

                        <!-- Casteo a Usuario usando $any() -->
                        <ng-container *ngIf="cuenta.rol === 'USUARIO'">
                            {{ $any(cuenta).nombres }} {{ $any(cuenta).apellidos }}
                        </ng-container>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end menu-usuario-nav">
                        <li>
                            <button class="dropdown-item" type="button" (click)="cerrarSesion()">Cerrar sesión</button>
                        </li>
                    </ul>
                </div>
            </ng-container>

            <ng-template #botonLogin>
                <div class="d-flex gap-2">
                    <a routerLink="/login" class="btn btn-outline-dark">Iniciar sesión</a>
                </div>
            </ng-template>

        </div>
    </div>
</nav>
